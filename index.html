<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe7">
<title>An Leabhar</title>
<meta name="description" content="An Leabhar — an eighteen-chapter reading edition.">
<style>
:root{
  --paper:#f3efe7;
  --ink:#1f201d;
  --muted:#706d64;
  --rule:#b8b0a2;
  --accent:#7b2f2a;
  --measure:44rem;
  --shadow:rgba(26,24,20,.08);
  --sans:Arial,Helvetica,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#d8d1c5}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.62),transparent 30rem),
    linear-gradient(180deg,#ddd6cb 0,#d1c8bb 100%);
  font-family:var(--serif);
  text-rendering:optimizeLegibility;
}
button{font:inherit}
.progress{
  position:fixed;inset:0 0 auto 0;height:3px;z-index:60;
  background:linear-gradient(90deg,var(--accent) var(--progress,0%),transparent 0);
  pointer-events:none
}
.chapter-rail-wrap{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(75,65,50,.2);
  background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(14px);
}
.chapter-rail{
  width:min(100%,67rem);
  margin:auto;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:.85rem;
  padding:.72rem 1rem;
}
.rail-title{
  font:700 .68rem/1 var(--sans);
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap
}
.chapter-strip{
  display:flex;
  gap:.35rem;
  overflow-x:auto;
  scrollbar-width:none;
  scroll-behavior:smooth;
  padding:.1rem 0
}
.chapter-strip::-webkit-scrollbar{display:none}
.chapter-tab{
  flex:0 0 auto;
  min-width:2.15rem;height:2.15rem;
  border:1px solid rgba(75,65,50,.22);
  border-radius:999px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font:700 .72rem/1 var(--sans)
}
.chapter-tab:hover{border-color:var(--accent);color:var(--accent)}
.chapter-tab[aria-current="page"]{
  border-color:var(--accent);
  background:var(--accent);
  color:#fffaf4
}
.chapter-count{
  font:700 .68rem/1 var(--sans);
  color:var(--muted);
  white-space:nowrap
}
.shell{
  width:min(100%,67rem);
  margin:2.4rem auto 4.5rem;
  background:var(--paper);
  box-shadow:0 1.5rem 4rem var(--shadow);
  border:1px solid rgba(75,65,50,.14)
}
.mast{
  padding:5.5rem 8vw 3.6rem;
  border-bottom:1px solid var(--rule);
  position:relative;
  overflow:hidden
}
.mast::after{
  content:attr(data-roman);
  position:absolute;
  right:5%;
  top:-2.8rem;
  font:700 17rem/1 var(--serif);
  color:rgba(31,32,29,.035);
  pointer-events:none
}
.kicker{
  font:700 .72rem/1 var(--sans);
  letter-spacing:.22em;
  color:var(--accent);
  margin-bottom:2rem
}
h1{
  margin:0;
  max-width:13ch;
  font-weight:400;
  font-size:clamp(3.25rem,8.5vw,7.1rem);
  line-height:.9;
  letter-spacing:-.045em;
  text-wrap:balance
}
.deck{
  margin:2rem 0 0;
  color:var(--muted);
  max-width:34rem;
  font-style:italic;
  font-size:1rem;
  line-height:1.5
}
.meta{
  display:flex;gap:1.2rem;flex-wrap:wrap;
  margin-top:2.7rem;
  font:400 .73rem/1.4 var(--sans);
  color:var(--muted);
  letter-spacing:.06em;
  text-transform:uppercase
}
article{
  max-width:var(--measure);
  margin:0 auto;
  padding:4.6rem 2rem 5.2rem
}
article p{
  margin:0 0 1.45rem;
  font-size:clamp(1.12rem,2.2vw,1.3rem);
  line-height:1.72;
  hanging-punctuation:first last
}
article p:first-of-type{
  font-size:clamp(1.35rem,2.6vw,1.72rem);
  line-height:1.55;
  font-weight:700;
  letter-spacing:-.012em;
  margin-bottom:2rem
}
article p:first-of-type::first-letter{
  float:left;
  font-size:5.6rem;
  line-height:.72;
  padding:.13em .13em 0 0;
  color:var(--accent)
}
article h2,article h3{
  font-weight:500;
  line-height:1.15;
  text-wrap:balance
}
article h2{font-size:2rem;margin:3.5rem 0 1.4rem}
article h3{font-size:1.5rem;margin:2.8rem 0 1.2rem}
article blockquote{
  margin:2.6rem 0;
  padding:.2rem 0 .2rem 1.35rem;
  border-left:2px solid var(--accent);
  color:var(--muted)
}
article ul,article ol{padding-left:1.5rem}
article li{margin:.5rem 0}
article hr{
  border:0;
  width:4.5rem;height:1px;
  background:var(--rule);
  margin:3.25rem auto
}
.loading,.error{
  color:var(--muted);
  font:500 .9rem/1.5 var(--sans)
}
.chapter-foot{
  border-top:1px solid var(--rule);
  padding:1.5rem 8vw 2rem;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:1rem;
  align-items:center;
  font-family:var(--sans)
}
.nav-btn{
  border:0;background:transparent;color:var(--accent);
  cursor:pointer;padding:.5rem 0;
  font:700 .72rem/1.25 var(--sans);
  letter-spacing:.04em;
  text-transform:uppercase
}
.nav-btn.prev{text-align:left}
.nav-btn.next{text-align:right}
.nav-btn:disabled{visibility:hidden}
.foot-label{
  color:var(--muted);
  font:.68rem/1.2 var(--sans);
  letter-spacing:.07em;
  text-transform:uppercase;
  text-align:center
}
.controls{
  position:fixed;
  right:1rem;bottom:1rem;
  display:flex;gap:.5rem;
  z-index:55
}
.control-btn{
  border:1px solid rgba(0,0,0,.14);
  background:rgba(243,239,231,.94);
  color:var(--ink);
  padding:.65rem .8rem;
  border-radius:999px;
  font:600 .75rem/1 var(--sans);
  cursor:pointer;
  box-shadow:0 .35rem 1rem rgba(0,0,0,.08)
}
body.night{
  --paper:#171814;
  --ink:#e8e3d8;
  --muted:#aaa395;
  --rule:#45443e;
  --accent:#ce746c;
  background:#0f100e
}
body.night .mast::after{color:rgba(255,255,255,.035)}
body.night .control-btn{background:rgba(23,24,20,.94);color:var(--ink);border-color:rgba(255,255,255,.12)}
body.night .chapter-rail-wrap{background:rgba(23,24,20,.94);border-color:rgba(255,255,255,.1)}
body.night .chapter-tab{border-color:rgba(255,255,255,.16)}
@media(max-width:720px){
  .chapter-rail{grid-template-columns:auto 1fr;padding:.62rem .75rem}
  .rail-title{display:none}
  .chapter-count{font-size:.62rem}
  .shell{margin:0;border:0;box-shadow:none}
  .mast{padding:4.5rem 1.35rem 3rem}
  .mast::after{font-size:12rem;top:-1.4rem}
  article{padding:3.75rem 1.35rem 4rem}
  .chapter-foot{padding:1.2rem 1.35rem 4.8rem}
  .controls{right:.75rem;bottom:.75rem}
}
@media print{
  html,body{background:#fff!important}
  body{color:#000}
  .progress,.chapter-rail-wrap,.controls,.chapter-foot{display:none!important}
  .shell{box-shadow:none;border:0;margin:0;width:100%}
  .mast{padding:2.2cm 2cm 1.5cm}
  article{max-width:15.5cm;padding:1.5cm 0 2cm}
  article p{font-size:11.5pt;line-height:1.55}
  h1{font-size:46pt}
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>

<nav class="chapter-rail-wrap" aria-label="Chapters">
  <div class="chapter-rail">
    <div class="rail-title">An Leabhar</div>
    <div id="chapterStrip" class="chapter-strip" aria-label="Choose a chapter"></div>
    <div id="chapterCount" class="chapter-count">1 / 18</div>
  </div>
</nav>

<div class="controls" aria-label="Reading controls">
  <button class="control-btn" id="theme" type="button">Night</button>
  <button class="control-btn" id="print" type="button">Print</button>
</div>

<main class="shell">
  <header class="mast" id="mast" data-roman="I">
    <div class="kicker" id="kicker">CHAPTER ONE</div>
    <h1 id="chapterTitle">The Feet</h1>
    <p class="deck" id="deck">An eighteen-chapter reading edition.</p>
    <div class="meta"><span>Draft manuscript</span><span>Reading edition</span></div>
  </header>

  <article id="manuscript" aria-live="polite">
    <p class="loading">Opening the book…</p>
  </article>

  <footer class="chapter-foot">
    <button class="nav-btn prev" id="prev" type="button">← Previous</button>
    <div class="foot-label" id="footLabel">Chapter 1 of 18</div>
    <button class="nav-btn next" id="next" type="button">Next →</button>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
const manuscriptUrl='https://raw.githubusercontent.com/TitanicParker/an-leabhar/main/Manuscript.md';
const manuscript=document.getElementById('manuscript');
const chapterStrip=document.getElementById('chapterStrip');
const chapterCount=document.getElementById('chapterCount');
const chapterTitle=document.getElementById('chapterTitle');
const kicker=document.getElementById('kicker');
const mast=document.getElementById('mast');
const footLabel=document.getElementById('footLabel');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const theme=document.getElementById('theme');
const printBtn=document.getElementById('print');
let chapters=[];
let current=0;

const roman=n=>{
  const m=[['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
  let out='';for(const [s,v] of m){while(n>=v){out+=s;n-=v}}return out;
};
const words=['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen'];

function splitChapters(md){
  const lines=md.split(/\r?\n/);
  const starts=[];
  lines.forEach((line,i)=>{if(/^#\s+Chapter\s+/i.test(line))starts.push(i)});
  return starts.map((start,idx)=>{
    const end=idx+1<starts.length?starts[idx+1]:lines.length;
    const heading=lines[start].replace(/^#\s+/,'').trim();
    const match=heading.match(/^Chapter\s+([^—-]+)\s*[—-]\s*(.+)$/i);
    const number=idx+1;
    const title=match?match[2].trim():heading.replace(/^Chapter\s+\S+\s*/i,'').trim();
    const body=lines.slice(start+1,end).join('\n').replace(/^\s*---\s*$/gm,'').trim();
    return{number,title,body};
  });
}

function buildTabs(){
  chapterStrip.innerHTML='';
  chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='chapter-tab';
    b.textContent=String(c.number);
    b.setAttribute('aria-label','Chapter '+c.number+': '+c.title);
    b.addEventListener('click',()=>showChapter(i,true));
    chapterStrip.appendChild(b);
  });
}

function showChapter(i,pushHash=false){
  if(!chapters.length)return;
  current=Math.max(0,Math.min(i,chapters.length-1));
  const c=chapters[current];
  manuscript.innerHTML=DOMPurify.sanitize(marked.parse(c.body));
  chapterTitle.textContent=c.title;
  kicker.textContent='CHAPTER '+words[current].toUpperCase();
  mast.dataset.roman=roman(c.number);
  chapterCount.textContent=c.number+' / '+chapters.length;
  footLabel.textContent='Chapter '+c.number+' of '+chapters.length;
  prev.disabled=current===0;
  next.disabled=current===chapters.length-1;
  [...chapterStrip.children].forEach((b,j)=>{
    if(j===current)b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  const active=chapterStrip.children[current];
  active?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  if(pushHash)history.replaceState(null,'','#chapter-'+c.number);
  document.title='Chapter '+c.number+' — '+c.title+' · An Leabhar';
  scrollTo({top:0,behavior:'smooth'});
  updateProgress();
}

function chapterFromHash(){
  const m=location.hash.match(/chapter-(\d+)/i);
  return m?Math.max(0,Number(m[1])-1):0;
}
function updateProgress(){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  const pct=max>0?(h.scrollTop/max)*100:0;
  h.style.setProperty('--progress',pct+'%');
}
addEventListener('scroll',updateProgress,{passive:true});
prev.addEventListener('click',()=>showChapter(current-1,true));
next.addEventListener('click',()=>showChapter(current+1,true));
addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowLeft'&&current>0)showChapter(current-1,true);
  if(e.key==='ArrowRight'&&current<chapters.length-1)showChapter(current+1,true);
});
theme.addEventListener('click',()=>{
  document.body.classList.toggle('night');
  theme.textContent=document.body.classList.contains('night')?'Day':'Night';
});
printBtn.addEventListener('click',()=>window.print());

(async()=>{
  try{
    const r=await fetch(manuscriptUrl,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    chapters=splitChapters(await r.text());
    if(!chapters.length)throw new Error('No chapters found');
    buildTabs();
    showChapter(chapterFromHash(),false);
  }catch(e){
    manuscript.innerHTML='<div class="error"><p>The manuscript could not be opened just now.</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
